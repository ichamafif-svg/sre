services:
  postgres:
    image: postgres:16.4
    environment:
      POSTGRES_USER: control_plane
      POSTGRES_PASSWORD: control_plane
      POSTGRES_DB: control_plane
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U control_plane -d control_plane"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - phase1_postgres:/var/lib/postgresql/data

  temporal:
    image: temporalio/auto-setup:1.29.7
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB: postgresql
      DB_PORT: 5432
      POSTGRES_USER: control_plane
      POSTGRES_PWD: control_plane
      POSTGRES_SEEDS: postgres
      DYNAMIC_CONFIG_FILE_PATH: config/dynamicconfig/development-sql.yaml
    ports:
      - "7233:7233"

  temporal-ui:
    image: temporalio/ui:2.38.3
    depends_on:
      - temporal
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: http://localhost:3000
    ports:
      - "8080:8080"

  opa:
    image: openpolicyagent/opa:1.7.1-debug
    command:
      - run
      - --server
      - --addr=:8181
      - /policies
    ports:
      - "8181:8181"
    volumes:
      - ../../policy/rego:/policies:ro

volumes:
  phase1_postgres:

